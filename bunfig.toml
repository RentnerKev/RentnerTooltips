[install]
minimumReleaseAge = 86400
linker = "isolated"
globalStore = false
[test]
root = "src/tests"
pathIgnorePatterns = ["**/*.db.test.ts"]

# The empty .oxfmtrc.json preserves Bun's Oxfmt output mode.
[fmt]
semi = false
singleQuote = true
trailingComma = "all"
tabWidth = 4
useTabs = false
printWidth = 80
sortPackageJson = false
ignorePatterns = [
    "**/dist/",
    "**/build/",
    "**/node_modules/",
    "bun.lock",
    "**/drizzle/",
    "**/.env",
    "**/.env.*",
    "**/routeTree.gen.ts",
    "**/*.generated.ts",
    "test-results/",
    "playwright-report/",
]
